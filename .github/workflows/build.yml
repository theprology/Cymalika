name: Build and test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Test Windows app control
        timeout-minutes: 3
        if: matrix.target == 'win'
        run: node scripts/test-computer-live.mjs
      - name: Prepare Linux desktop tests
        timeout-minutes: 10
        if: matrix.target == 'linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' 'https://azure.archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core dbus-x11 xvfb openbox wmctrl xdotool
          node -e 'require("electron")'
          if [ -f node_modules/electron/dist/chrome-sandbox ]; then sudo chown root:root node_modules/electron/dist/chrome-sandbox; sudo chmod 4755 node_modules/electron/dist/chrome-sandbox; fi
      - name: Test Linux app control
        timeout-minutes: 3
        if: matrix.target == 'linux'
        run: scripts/with-linux-desktop.sh node scripts/test-computer-live.mjs
      - run: npm run dist:${{ matrix.target }}
      - name: Install and check Windows terminal packages
        if: matrix.target == 'win'
        run: ./scripts/test-windows-install.ps1
      - name: Install and check the Linux package
        if: matrix.target == 'linux'
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' 'https://azure.archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          sudo apt-get update
          sudo apt-get install -y xvfb
          node scripts/test-unix-install.mjs dist/*.deb
          scripts/with-linux-desktop.sh node scripts/smoke.mjs /opt/CyMalika/cymalika-workspace
      - uses: actions/upload-artifact@v4
        with:
          name: cymalika-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: CYMALIKA_ARCH=$(uname -m) ./build.sh
      - run: python3 source/test-native-stream.py
      - run: python3 source/test-model-library.py
      - run: |
          mkdir -p staging
          ditto build/CyMalika.app staging/CyMalika.app
          cp LICENSE README.md staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname CyMalika -srcfolder staging -ov -format UDZO dist-cymalika-mac-$(uname -m).dmg
          hdiutil verify dist-cymalika-mac-$(uname -m).dmg
          node scripts/test-unix-install.mjs dist-cymalika-mac-$(uname -m).dmg
          if [ "$(uname -m)" = arm64 ]; then "$HOME/Applications/CyMalika.app/Contents/MacOS/CyMalika" --self-test; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cymalika-mac
          path: dist-cymalika-mac-*.dmg
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Prepare downloadable release files
        run: |
          version="${GITHUB_REF_NAME#v}"
          for package in release/dist-cymalika-mac-*.dmg; do
            [ -e "$package" ] || continue
            arch="${package##*mac-}"
            mv "$package" "release/CyMalika-$version-mac-$arch"
          done
          cp install.sh install.ps1 docs/CyMalika-Beginners-Handbook.pdf release/
          git archive --format=zip --prefix=CyMalika/ -o "release/CyMalika-source-$version.zip" HEAD
          cd release
          sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; build artifacts remain attached to this workflow run."
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --title "CyMalika $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
