name: Build and test
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:${{ matrix.target }}
      - name: Check packaged Windows startup
        if: matrix.target == 'win'
        run: node scripts/smoke.mjs dist/win-unpacked/Cipher.exe
      - name: Install and check the Linux package
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ./dist/*.deb xvfb
          xvfb-run -a node scripts/smoke.mjs /opt/Cipher/cipher-workspace
      - uses: actions/upload-artifact@v4
        with:
          name: cipher-${{ matrix.target }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: CIPHER_ARCH=$(uname -m) ./build.sh
      - run: python3 source/test-native-stream.py
      - run: |
          mkdir -p staging
          ditto build/Cipher.app staging/Cipher.app
          cp LICENSE README.md staging/
          ln -s /Applications staging/Applications
          hdiutil create -volname Cipher -srcfolder staging -ov -format UDZO dist-cipher-mac-$(uname -m).dmg
          hdiutil verify dist-cipher-mac-$(uname -m).dmg
      - uses: actions/upload-artifact@v4
        with:
          name: cipher-mac
          path: dist-cipher-mac-*.dmg
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - run: cd release && sha256sum * > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; build artifacts remain attached to this workflow run."
          else
            gh release create "$GITHUB_REF_NAME" release/* --draft --title "Cipher $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          fi
