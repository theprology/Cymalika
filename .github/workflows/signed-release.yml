name: Signed release candidate
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build and verify
        type: choice
        default: all
        options: [all, mac, windows, linux]
permissions:
  contents: read
jobs:
  windows:
    if: inputs.platform == 'all' || inputs.platform == 'windows'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      CYMALIKA_AZURE_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      CYMALIKA_AZURE_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      CYMALIKA_AZURE_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/test-computer-live.mjs
      - run: npm run bundle
      - run: node scripts/build-signed-windows.mjs
      - run: ./scripts/test-windows-install.ps1
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: dist/*.exe
  mac:
    if: inputs.platform == 'all' || inputs.platform == 'mac'
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CYMALIKA_SIGN_IDENTITY: ${{ vars.MAC_SIGN_IDENTITY }}
      CYMALIKA_NOTARY_PROFILE: CyMalikaCI
      CYMALIKA_REQUIRE_SIGNING: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Import release identity
        shell: bash
        run: |
          set -euo pipefail
          for key in MAC_CERTIFICATE_P12 MAC_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER CYMALIKA_SIGN_IDENTITY; do
            [ -n "${!key}" ] || { echo "Missing release credential: $key" >&2; exit 1; }
          done
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          keychain="$RUNNER_TEMP/cymalika-release.keychain-db"
          echo "CYMALIKA_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cymalika.p12"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/cymalika.p12" "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cymalika.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials CyMalikaCI --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/cymalika.p12" "$RUNNER_TEMP/AuthKey.p8"
      - run: npm ci
      - run: npm test
      - run: CYMALIKA_ARCH=$(uname -m) ./build.sh
      - name: Notarize app and disk image
        shell: bash
        run: |
          set -euo pipefail
          scripts/notarize-mac.sh build/CyMalika.app
          mkdir staging
          ditto build/CyMalika.app staging/CyMalika.app
          cp LICENSE README.md staging/
          ln -s /Applications staging/Applications
          version=$(node -p 'require("./package.json").version')
          image="CyMalika-$version-mac-$(uname -m).dmg"
          hdiutil create -volname CyMalika -srcfolder staging -ov -format UDZO "$image"
          codesign --timestamp --sign "$CYMALIKA_SIGN_IDENTITY" "$image"
          scripts/notarize-mac.sh "$image"
          hdiutil verify "$image"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: CyMalika-*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: notarized-mac
          path: CyMalika-*.dmg
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/cymalika.p12" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/cymalika-release.keychain-db" || true
  linux:
    if: inputs.platform == 'all' || inputs.platform == 'linux'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prepare desktop tools
        timeout-minutes: 10
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then printf '%s\n' 'https://azure.archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null; fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-gi gir1.2-atspi-2.0 gir1.2-gtk-3.0 at-spi2-core dbus-x11 xvfb openbox wmctrl xdotool
          node -e 'require("electron")'
          if [ -f node_modules/electron/dist/chrome-sandbox ]; then sudo chown root:root node_modules/electron/dist/chrome-sandbox; sudo chmod 4755 node_modules/electron/dist/chrome-sandbox; fi
      - name: Verify live computer control
        timeout-minutes: 3
        run: scripts/with-linux-desktop.sh node scripts/test-computer-live.mjs
      - run: npm run dist:linux
      - name: Verify installed package
        run: |
          node scripts/test-unix-install.mjs dist/*.deb
          scripts/with-linux-desktop.sh node scripts/smoke.mjs /opt/CyMalika/cymalika-workspace
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.AppImage
            dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: attested-linux
          path: |
            dist/*.AppImage
            dist/*.deb
