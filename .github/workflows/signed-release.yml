name: Signed release candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_P12 }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      CIPHER_AZURE_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      CIPHER_AZURE_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      CIPHER_AZURE_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/test-computer-live.mjs
      - run: npm run bundle
      - run: node scripts/build-signed-windows.mjs
      - run: ./scripts/test-windows-install.ps1
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/*.exe
      - uses: actions/upload-artifact@v4
        with:
          name: signed-windows
          path: dist/*.exe
  mac:
    runs-on: macos-latest
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      MAC_CERTIFICATE_P12: ${{ secrets.MAC_CERTIFICATE_P12 }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      CIPHER_SIGN_IDENTITY: ${{ vars.MAC_SIGN_IDENTITY }}
      CIPHER_NOTARY_PROFILE: CipherCI
      CIPHER_REQUIRE_SIGNING: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Import release identity
        shell: bash
        run: |
          set -euo pipefail
          for key in MAC_CERTIFICATE_P12 MAC_CERTIFICATE_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER CIPHER_SIGN_IDENTITY; do
            [ -n "${!key}" ] || { echo "Missing release credential: $key" >&2; exit 1; }
          done
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          keychain="$RUNNER_TEMP/cipher-release.keychain-db"
          echo "CIPHER_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          printf '%s' "$MAC_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cipher.p12"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/cipher.p12" "$RUNNER_TEMP/AuthKey.p8"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cipher.p12" -k "$keychain" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          xcrun notarytool store-credentials CipherCI --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --keychain "$keychain"
          rm -f "$RUNNER_TEMP/cipher.p12" "$RUNNER_TEMP/AuthKey.p8"
      - run: npm ci
      - run: npm test
      - run: CIPHER_ARCH=$(uname -m) ./build.sh
      - name: Notarize app and disk image
        shell: bash
        run: |
          set -euo pipefail
          scripts/notarize-mac.sh build/Cipher.app
          mkdir staging
          ditto build/Cipher.app staging/Cipher.app
          cp LICENSE README.md staging/
          ln -s /Applications staging/Applications
          version=$(node -p 'require("./package.json").version')
          image="Cipher-$version-mac-$(uname -m).dmg"
          hdiutil create -volname Cipher -srcfolder staging -ov -format UDZO "$image"
          codesign --timestamp --sign "$CIPHER_SIGN_IDENTITY" "$image"
          scripts/notarize-mac.sh "$image"
          hdiutil verify "$image"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: Cipher-*.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: notarized-mac
          path: Cipher-*.dmg
      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/cipher.p12" "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/cipher-release.keychain-db" || true
