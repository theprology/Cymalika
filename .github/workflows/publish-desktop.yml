name: Publish verified desktop packages
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Build and test run
        required: true
      source_sha:
        description: Exact source commit built by that run
        required: true
      release_id:
        description: Unpublished draft release ID
        required: true
      mac_sha256:
        description: SHA256 of the notarized Mac image already attached to the draft
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: cymalika-desktop-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CI_RUN: ${{ inputs.run_id }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CYMALIKA_RELEASE_ID: ${{ inputs.release_id }}
      MAC_SHA256: ${{ inputs.mac_sha256 }}
    steps:
      - name: Verify source build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RUN" =~ ^[0-9]+$ ]]
          [[ "$CYMALIKA_RELEASE_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$MAC_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$REPOSITORY/actions/runs/$CI_RUN" > /tmp/source-build.json
          python3 - <<'PY'
          import json, os
          run=json.load(open('/tmp/source-build.json'))
          assert run['head_sha']==os.environ['SOURCE_SHA'], 'Source commit mismatch'
          assert run['status']=='completed' and run['conclusion']=='success', 'Source build has not passed'
          assert run['name']=='Build and test', 'Unexpected source workflow'
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: cymalika-*
          merge-multiple: true
          path: release-files
      - name: Prepare and verify release
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./package.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag="v$version"
          export CYMALIKA_VERSION="$version" CYMALIKA_TAG="$tag"
          gh api "repos/$REPOSITORY/releases/$CYMALIKA_RELEASE_ID" > /tmp/draft.json
          python3 - <<'PY'
          import json, os
          release=json.load(open('/tmp/draft.json'))
          assert release['draft'], 'Only an unpublished draft may be updated'
          assert release['target_commitish']==os.environ['SOURCE_SHA'], 'Draft source does not match verified build'
          PY
          mac_asset=$(python3 -c 'import json,os; print(next(a["id"] for a in json.load(open("/tmp/draft.json"))["assets"] if a["name"]=="CyMalika-"+os.environ["CYMALIKA_VERSION"]+"-mac-arm64.dmg"))')
          gh api "repos/$REPOSITORY/releases/assets/$mac_asset" -H 'Accept: application/octet-stream' > "release-files/CyMalika-$version-mac-arm64.dmg"
          printf '%s  %s\n' "$MAC_SHA256" "release-files/CyMalika-$version-mac-arm64.dmg" | sha256sum -c -
          cp install.sh install.ps1 docs/CyMalika-Beginners-Handbook.pdf release-files/
          cp docs/media/cymalika-walkthrough.mp4 release-files/CyMalika-Quickstart.mp4
          cp docs/media/cymalika-walkthrough.gif release-files/CyMalika-Quickstart.gif
          cp docs/CyMalika-Getting-Started.zip release-files/CyMalika-Getting-Started.zip
          git archive --format=zip --prefix=CyMalika/ -o "release-files/CyMalika-source-$version.zip" HEAD
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('release-files');v=os.environ['CYMALIKA_VERSION']
          names=[f'CyMalika-{v}-x64-setup.exe',f'CyMalika-{v}-x64-portable.exe',f'CyMalika-{v}-amd64.deb',f'CyMalika-{v}-x86_64.AppImage',f'CyMalika-{v}-mac-arm64.dmg',f'CyMalika-source-{v}.zip','install.sh','install.ps1','CyMalika-Beginners-Handbook.pdf','CyMalika-Quickstart.mp4','CyMalika-Quickstart.gif','CyMalika-Getting-Started.zip']
          sums={}
          for name in names:
              p=root/name
              assert p.is_file() and p.stat().st_size>0, 'Missing '+name
              h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              sums[name]=h.hexdigest()
          (root/'SHA256SUMS.txt').write_text(''.join(f'{digest}  {name}\n' for name,digest in sorted(sums.items())))
          (pathlib.Path('/tmp/asset-names.json')).write_text(json.dumps(names+['SHA256SUMS.txt']))
          notes=pathlib.Path('docs/RELEASE_NOTES.md').read_text().split('## '+v+'\n',1)[1].split('\n## ',1)[0].strip()+f'''

          Coffee keeps the computer and display awake on Windows/Linux. On Mac it also prevents disk idle sleep, matching caffeinate -dim while CyMalika is open. No AI model is bundled or downloaded automatically. Use Models & downloads to choose a model download inside CyMalika.

          Validation: Windows setup and portable installation, Linux package installation, packaged UI/native IPC checks for Coffee, colours, keyboard, file tabs and draft isolation, plus native computer-control fixtures and the shared test suite. Build: https://github.com/{os.environ['REPOSITORY']}/actions/runs/{os.environ['CI_RUN']} .

          Signing: the Mac image is Developer ID signed and Apple-notarized. Windows installers are currently unsigned. SHA-256 checksums are provided for every download. Keep using your existing model and settings.

          Source commit: {os.environ['SOURCE_SHA']}
          '''
          pathlib.Path('/tmp/release-notes.md').write_text(notes)
          PY
          python3 - <<'PY'
          import hashlib,http.client,json,os,pathlib,urllib.parse
          existing={a['name']:a for a in json.load(open('/tmp/draft.json'))['assets']}
          for name in json.load(open('/tmp/asset-names.json')):
              p=pathlib.Path('release-files')/name;h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              if name in existing:
                  assert existing[name]['digest']=='sha256:'+h.hexdigest(), 'Existing draft asset differs: '+name
                  continue
              c=http.client.HTTPSConnection('uploads.github.com',timeout=120)
              target='/repos/'+os.environ['REPOSITORY']+'/releases/'+os.environ['CYMALIKA_RELEASE_ID']+'/assets?name='+urllib.parse.quote(name)
              c.putrequest('POST',target)
              for k,v in {'Authorization':'Bearer '+os.environ['GH_TOKEN'],'User-Agent':'CyMalika-release','Accept':'application/vnd.github+json','Content-Type':'application/octet-stream','Content-Length':str(p.stat().st_size)}.items():c.putheader(k,v)
              c.endheaders()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):c.send(chunk)
              response=c.getresponse();result=json.loads(response.read());status=response.status;c.close()
              assert status==201, (name,status,result.get('message'))
              print('Uploaded '+name)
          PY
          gh api "repos/$REPOSITORY/releases/$CYMALIKA_RELEASE_ID" > /tmp/uploaded-release.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          release=json.load(open('/tmp/uploaded-release.json'));assert release['draft']
          assets={a['name']:a for a in release['assets']}
          for name in json.load(open('/tmp/asset-names.json')):
              p=pathlib.Path('release-files')/name;h=hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024),b''):h.update(chunk)
              a=assets[name]
              assert a['state']=='uploaded' and a['size']==p.stat().st_size, name+' size mismatch'
              assert a['digest']=='sha256:'+h.hexdigest(), name+' digest mismatch'
          print('PASS: all release assets match verified build bytes and checksums')
          PY
          python3 - <<'PY'
          import json,os,pathlib
          pathlib.Path('/tmp/publish-request.json').write_text(json.dumps({'draft':False,'make_latest':'true','name':'CyMalika '+os.environ['CYMALIKA_VERSION'],'body':pathlib.Path('/tmp/release-notes.md').read_text()}))
          PY
          gh api --method PATCH "repos/$REPOSITORY/releases/$CYMALIKA_RELEASE_ID" --input /tmp/publish-request.json --jq .html_url
      - name: Keep only the latest verified public release
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPOSITORY/releases/latest" > /tmp/latest-release.json
          python3 - <<'PYCODE'
          import json,os,subprocess
          latest=json.load(open('/tmp/latest-release.json'))
          assert str(latest['id'])==os.environ['CYMALIKA_RELEASE_ID'], 'Another release is latest; no cleanup performed'
          assert not latest['draft'] and not latest['prerelease']
          expected=set(json.load(open('/tmp/asset-names.json')))
          assert expected=={a['name'] for a in latest['assets']}, 'Latest assets differ; no cleanup performed'
          pages=json.loads(subprocess.check_output(['gh','api','--paginate','--slurp','repos/'+os.environ['REPOSITORY']+'/releases?per_page=100']))
          for release in [r for page in pages for r in page]:
              if release['id']==latest['id'] or release['draft']:continue
              assert release['created_at']<=latest['created_at'], 'Newer release exists; no cleanup performed'
              subprocess.run(['gh','api','--method','DELETE','repos/'+os.environ['REPOSITORY']+'/releases/'+str(release['id'])],check=True)
              print('Removed superseded release '+release['tag_name'])
          PYCODE
